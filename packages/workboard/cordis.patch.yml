# The dsh-workboard bundle layer: one insert over the profile root.
#
# The row's module is this package itself, so installing the bundle is all it
# takes to mount both halves — the Host data plane (the `/workboard` route
# family) and the Web client board. `name` is resolved from this package's own
# directory, so the row keeps working wherever the profile installed it.
- insert:
    - id: dsh-workboard
      name: dsh-workboard
